name: Verify plugin

# Syntax on the oldest and newest PHP the plugin claims to support, the
# output smoke test, and WordPress's own Plugin Check (the same checks
# wordpress.org runs on submission).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke test
        run: php tests/smoke.php

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: WordPress Coding Standards
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --quiet dealerdirect/phpcodesniffer-composer-installer wp-coding-standards/wpcs phpcompatibility/phpcompatibility-wp
          "$(composer global config home)/vendor/bin/phpcs" --standard=phpcs.xml.dist --error-severity=1 --warning-severity=0 --report=summary .
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Check what is actually distributed, not the repository. .distignore is
      # the single list of what stays behind — the workflows, the composer and
      # npm manifests, the coding-standards ruleset, the listing assets — and
      # Plugin Check rejects several of those on sight. Building first means CI
      # sees exactly the tree wordpress.org will.
      - name: Build the distributed plugin
        run: bash bin/build-zip.sh
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: './build/sendbeam'
          # The folder name is the slug (and the text domain): "sendbeam".
          slug: sendbeam
